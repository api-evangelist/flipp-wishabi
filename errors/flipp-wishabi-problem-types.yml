problem_types:
- id: missing-access-token
  status: 422
  message: Missing access_token parameter
  evidence: >-
    Observed live 2026-08-12 on GET
    /flyerkit/v4.0/publications/walmart?locale=en-CA&postal_code=M5V2T6 and on GET
    /flyerkit/v4.0/product/1
  remediation: >-
    Append `access_token=<token>` to the query string. Tokens are issued out of band by a Flipp
