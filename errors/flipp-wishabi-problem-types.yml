rfc9457: false
rfc9457_note: >-
  FlyerKit does NOT use RFC 9457 / RFC 7807. Errors are returned as `application/json;
  charset=utf-8` with a bespoke two-field envelope; there is no `application/problem+json` media
  type, no `type` URI, no `title`, no `instance`, and no extension members. An agent cannot
  dereference a problem type or branch on a stable machine-readable code.
envelope:
