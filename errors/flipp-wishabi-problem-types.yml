    type: string
    description: The error message (human-readable, free text)
    example: Invalid publication_id or access token
  - name: code
    type: string
    description: >-
      HTTP status code, restated in the body. Declared as `type: string` in the spec but observed
      live as a JSON NUMBER - the published contract and the deployed API disagree on this field's
      type, which will break a strictly-typed client.
    example: '422'
  observed_body: '{"message":"Missing access_token parameter","code":422}'
  observed_note: >-
    Live unauthenticated probe on 2026-08-12 returned HTTP 422 with `"code":422` as an unquoted
    number, contradicting the spec's `"type": "string"`.
status_codes:
- status: 422
  reason: Unprocessable Entity
  declared_on: every operation except GET /copyright
  declared_count: 10
  schema: '#/definitions/error'
  description: Missing or invalid parameters
  note: >-
    422 is FlyerKit's ONLY declared error status and it is overloaded. It covers authentication
    failure (missing or invalid access_token), authorization failure (a token without
    `see_future` permission), missing required parameters, and unknown identifiers - four
    distinct failure classes that a caller must disambiguate by string-matching `message`.
- status: 200
  reason: OK
  declared_on: all 11 operations
  note: >-
    An unmatched query returns HTTP 200 with an empty array rather than a 404. The spec states
    this explicitly for `locale`: "When localized content is not available for a given locale, an
    empty response is returned." Empty-set and wrong-locale are therefore indistinguishable.
