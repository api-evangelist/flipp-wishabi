gaps:
- No `application/problem+json` and no RFC 9457 adoption.
- No stable machine-readable error code vocabulary - only an HTTP status restated in the body,
  plus free-text English messages.
- 422 is used where 400, 401, 403 and 404 are the semantically correct statuses.
- No 429 and no 5xx responses declared anywhere in the contract.
- The `code` field's declared type (string) does not match the deployed type (number).
- Error messages are not localized even though the API is bilingual (en-CA / fr-CA / en-US).
