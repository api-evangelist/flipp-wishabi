gaps:
- No dated changelog for the API at any URL.
- The v4.0 diff is undated and describes only the hop from v3.0; earlier history is destroyed
  when a major is retired because the diff lives inside the spec document itself.
- Minor-version changes are invisible. The versioning policy says the server "will always serve
  the latest version for a major release," so additive changes ship silently with no announcement
  channel.
- No RSS/Atom feed, no email announcement list, and no developer blog for API changes.
