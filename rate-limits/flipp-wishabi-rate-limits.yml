governing_controls:
  - control: per-token issuance
    detail: >-
      Throughput is governed contractually rather than technically. Access tokens are issued
      one-to-one by a Flipp technical contact to a named retailer partner, and v4.0 added multiple
      tokens per retailer "with different levels of permission" - so abuse control lives in the
      account relationship, not in a published quota.
  - control: CDN caching
    detail: >-
      Responses are fronted by CloudFront and the cacheable endpoint returns
      `Cache-Control: max-age=3600, public` with a weak ETag, so conditional requests and edge
      caching absorb repeat reads. Authorized publication endpoints returned `no-cache`.
recommendation_to_provider: >-
  Publish a documented per-token limit and emit the IETF `RateLimit-Limit` / `RateLimit-Remaining`
  / `RateLimit-Reset` header trio plus `Retry-After` on a 429. Retail circular data is bursty -
  a weekly flyer drop makes every partner poll at once - and partners currently have no way to
  back off gracefully.
