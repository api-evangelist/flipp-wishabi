note: >-
  Flipp publishes NO rate limits for the FlyerKit API. The v4.0 Swagger document contains no
  rate-limit language, declares no 429 response on any of its 11 operations, and the narrative
  sections (Overview, Access Token Management, Supported Formats, Versioning) are silent on
  throughput. Two live responses were captured on 2026-08-12 - a 422 from the authorized surface
  and a 200 from the unauthenticated GET /copyright - and NEITHER carried a rate-limit header of
  any family. limit_count: 0 is a measured zero, not an unchecked field.
response_headers:
  ratelimit_family: none
  observed:
  - X-RateLimit-Limit: absent
  - X-RateLimit-Remaining: absent
  - X-RateLimit-Reset: absent
  - RateLimit-Limit: absent
  - RateLimit-Remaining: absent
  - RateLimit-Reset: absent
  - RateLimit-Policy: absent
  - Retry-After: absent
  exhaustion_status: unknown
  exhaustion_note: >-
    No 429 is declared in the contract and none was provoked. A caller has no runtime signal - no
    header to read, no documented status to branch on - and would discover any ceiling only by
    hitting it.
