    field.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  rfc8594: false
  note: >-
    Flipp publishes a VERSIONING policy but not a DEPRECATION policy. Nothing states how long a
    retired major remains callable, what notice partners receive, or how an end-of-life is
    announced. No `Sunset` or `Deprecation` response header was observed on any live probe
    (2026-08-12), and no operation in the v4.0 contract carries `deprecated: true`. The observed
    behaviour - v2.0 and v3.0 machine-readable documents now 404 with no tombstone and no
    redirect - is what a partner has instead of a policy. NO `Deprecation` pointer is emitted in
    apis.yml because there is no published policy to point at.
