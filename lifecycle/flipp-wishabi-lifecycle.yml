versioning:
  published: true
  scheme: semantic (major.minor)
  location: uri-path
  current: '4.0'
  base_path: /flyerkit/v4.0
  quoted: >-
    "FlyerKit uses a semantic versioning scheme with a major and minor version number. Requests are
    made against a major version as part of the base path in the URI. All backward compatible
    changes will be made in minor versions. Clients will not be able to request a specific minor
    version as the server will always serve the latest version for a major release. Any changes in
    the API that are not backward compatible will use an updated major version."
  implications:
  - A caller cannot pin a minor version - the server always serves the newest minor for the
    requested major, so additive changes arrive without opt-in.
  - Breaking changes are signalled only by the appearance of a new major path segment; nothing in
    a response tells a client its major is aging.
