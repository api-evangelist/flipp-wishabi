aid: flipp-wishabi
name: Flipp (Wishabi)
description: >-
  Flipp (operated by Wishabi) is a Toronto-based retail media and digital
  merchandising company that connects retailers, brands, and consumers through
  shoppable digital experiences. Its consumer app aggregates weekly digital
  flyers, coupons, and shopping lists from more than 2,000 retailers including
  Walmart, Kroger, Home Depot, CVS, and Publix, helping shoppers find local
  deals and clip offers to loyalty cards. For businesses, Flipp runs a retail
  media platform - content collection, curation, and distribution of "full
  fidelity" shoppable merchandising experiences reaching over 100 million
  high-intent households - plus sponsored video and shoppable-item ad solutions
  built on 400B+ intent-based shopping signals. For retail partners Flipp
  publishes the FlyerKit API - a public, versioned HTTPS/JSON API at
  api.flipp.com that exposes publications, pages, highlights, categories,
  products, store locators and geo lookup so retailers can embed their own
  circular content in web, email and native experiences - alongside the Flipp
  Platform SDKs (FlyerKit for iOS/Android, StorefrontsKit/SKit for SFML
  rendering, and the DVM digital-visual-merchandising SDK) distributed from
  github.com/wishabi and a credentialed JFrog Artifactory. Access tokens are
  issued by a Flipp technical contact rather than through self-service signup.
