aid: flipp-wishabi
name: Flipp (Wishabi)
description: >-
  Flipp (operated by Wishabi) is a Toronto-based retail media and digital
  merchandising company that connects retailers, brands, and consumers through
  shoppable digital experiences. Its consumer app aggregates weekly digital
  flyers, coupons, and shopping lists from more than 2,000 retailers including
  Walmart, Kroger, Home Depot, CVS, and Publix, helping shoppers find local
  deals and clip offers to loyalty cards. For businesses, Flipp runs a retail
  media platform - content collection, curation, and distribution of "full
  fidelity" shoppable merchandising experiences reaching over 100 million
  high-intent households - plus sponsored video and shoppable-item ad solutions
  built on 400B+ intent-based shopping signals. Flipp publishes no public
  developer API or portal; this profile captures the company's public web,
  merchant, and open-source (github.com/wishabi) surface for the API Evangelist
  network.
