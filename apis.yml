apis:
- name: Flipp FlyerKit API
  description: >-
    Public HTTPS/JSON API that gives retailers programmatic access to the structured
    circular ("publication") data that powers the Flipp platform - publications by
    merchant and store/postal code, publication pages, highlights, categories,
    products across or within a publication, detailed product records with matched
    coupons, sub-item inventory, the five closest stores to a postal/zip code, and
    normalized geo FSA lookup. Responses are JSON, requests are authorized with an
    access_token query parameter issued by a Flipp technical contact, CORS is
    supported, and versions are pinned in the URI path (v2.0, v3.0, v4.0). v4.0 adds
    multi-token permissions, future-publication visibility, and keyword/tag filtering.
  humanURL: https://api.flipp.com/flyerkit/v4.0/documentation
  baseURL: https://api.flipp.com/flyerkit/v4.0
