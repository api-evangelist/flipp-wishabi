  conforms: false
  evidence: >-
    /.well-known/agent-card.json and /.well-known/agent.json return 404 on api.flipp.com and
    corp.flipp.com, and a soft-404 SPA shell on www.flipp.com (probed 2026-08-12). See
    well-known/flipp-wishabi-well-known.yml.
- id: llmstxt
  conforms: false
  evidence: >-
    /llms.txt returns 404 on api.flipp.com, corp.flipp.com and help.flipp.com, and a soft-404 SPA
