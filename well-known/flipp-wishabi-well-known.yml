  named in the OpenAPI `host` field) returns a genuine 1052-byte 404 for all five paths.
  corp.flipp.com returns the WordPress 404 template. www.flipp.com is a single-page
  application whose catch-all route answers 200 with the SAME 41,244-byte HTML shell for
