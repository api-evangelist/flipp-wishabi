tool_naming_note: >-
  The FlyerKit Swagger document declares no `operationId` on any operation, so no tool name can be
  inherited from the contract. Each candidate tool below therefore cites its backing operation by
  METHOD + PATH, which is the only stable identifier the spec provides. The missing operationIds
  are themselves the blocker: an MCP server generated from this spec would produce unnamed tools.
tools:
- name: list_publications
  description: List available publications (circulars) for a merchant, resolved by store code or
    postal/ZIP code and a locale.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publications/{merchant_identifier}'
  required_inputs: [merchant_identifier, access_token, locale]
  optional_inputs: [store_code, postal_code, see_future, show_storefronts]
  returns: publication[]
- name: list_merchant_products
  description: List products across all of a merchant's publications, with keyword, tag and
    category filtering and offset pagination.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publications/{merchant_identifier}/products'
  required_inputs: [merchant_identifier, access_token, locale, store_code]
  optional_inputs: [postal_code, page, size, offset, display_type, keywords, tags, category,
    see_future, show_storefronts]
  returns: merchant_product[]
- name: list_publication_pages
  description: List the page images of one publication, with bounding boxes and three image
    renditions.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publication/{publication_id}/pages'
  required_inputs: [publication_id, access_token]
  returns: publication_page[]
- name: list_publication_highlights
  description: List the named highlight regions on a publication's pages.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publication/{publication_id}/highlights'
  required_inputs: [publication_id, access_token]
  returns: publication_highlight[]
- name: list_publication_categories
  description: List the merchandising categories within a publication.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publication/{publication_id}/categories'
  required_inputs: [publication_id, access_token]
  returns: publication_category[]
- name: list_publication_products
  description: List the offer items within one publication, with filtering, sorting and offset
    pagination.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /publication/{publication_id}/products'
  required_inputs: [publication_id, access_token]
  optional_inputs: [page, size, offset, display_type, postal_code, store_code, keywords, tags,
    sort_by, sort_order, category]
  returns: product[]
- name: get_product
  description: Get the full detail record for one product, including coupons, reviews, rich media,
    specs and features.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /product/{product_id}'
  required_inputs: [product_id, access_token]
  optional_inputs: [postal_code, store_code]
  returns: detailed_product
- name: list_product_sub_items
  description: Get store-level inventory sub-items for a product (sourced from the MI9 Retail
    API), including add-to-cart affordances.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /product/{product_id}/sub_items'
  required_inputs: [product_id, access_token, store_code]
  returns: inventory_sub_item[]
- name: find_stores
  description: Return the closest stores to a postal/ZIP code for a merchant.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /stores/{merchant_identifier}'
  required_inputs: [merchant_identifier, access_token, postal_code]
  returns: store[]
- name: geolocate_fsa
  description: Resolve the caller's Forward Sortation Area from IP for a merchant.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /fsa/{merchant_name_identifier}'
  required_inputs: [merchant_name_identifier, access_token]
  optional_inputs: [ip_override]
  returns: fsa
- name: get_copyright
  description: Return Flipp's copyright notice. The only unauthenticated operation.
  source_operation: 'openapi/flipp-wishabi-flyerkit-openapi.yml#GET /copyright'
  required_inputs: []
  returns: text/plain
