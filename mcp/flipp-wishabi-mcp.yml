note: >-
  Flipp publishes NO MCP server. No hosted or remote MCP endpoint was found on any Flipp host, no
  MCP package exists under github.com/wishabi or on npm, and nothing in the FlyerKit documentation
  mentions agents or tools. The tool list below is a CANDIDATE derived from the 11 operations in
  the published v4.0 Swagger document - it describes what a FlyerKit MCP server WOULD expose, and
  it is not offered by Flipp. It is recorded so the shape of the opportunity is legible, and it
  carries NO `MCPServer` pointer in apis.yml because that pointer asserts the provider serves the
  surface.
