blockers_for_a_real_server:
- >-
  The credential is a URL query parameter issued out of band by a human. An MCP server would have
  to hold a long-lived partner token with no rotation or revocation endpoint.
- >-
  `merchant_identifier` is not discoverable through the API - there is no merchants endpoint - so
  an agent cannot bootstrap without being told the identifier out of band.
- >-
  No operationIds in the spec, so tool names cannot be generated deterministically from the
  contract.
- >-
  Error semantics collapse authentication, authorization, validation and not-found into a single
  422 with a free-text message, which an agent cannot branch on reliably.
- >-
  The copyright notice served by GET /copyright asserts "This API cannot be accessed and the
  content and any results may not be used, reproduced or transmitted in any manner without express
  written permission from Flipp Corp." Any agent surface over this data is a licensing decision
  for Flipp, not a technical one.
