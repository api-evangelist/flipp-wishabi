note: >-
  Flipp publishes NO client library to any public package registry - npm, PyPI, Maven Central,
  RubyGems, CocoaPods trunk, NuGet, crates.io and pkg.go.dev were all queried and none carries a
  first-party Flipp SDK (`com.flipp` has 0 artifacts on Maven Central; `FlyerKit` 404s on the
  CocoaPods trunk; the only npm package under github.com/wishabi is an unrelated 2021 landing-page
  experiment). Distribution is instead (a) GitHub binary repos consumed by Swift Package Manager,
  and (b) a CREDENTIALED JFrog Artifactory Maven repository whose credentials are "provided by
  Flipp". Currency below is therefore read from GitHub release/tag metadata and from the version
  pins the provider's own sample apps declare - both provider-published and reliably dated - rather
  than from a public registry metadata endpoint.
