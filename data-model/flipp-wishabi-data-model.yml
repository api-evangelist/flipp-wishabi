    identifier leaking into the public contract.
observations:
- >-
  The graph has no hub object for the merchant. Every read starts from a `merchant_identifier`
  string the integrator must be told, which is what makes this a partner API rather than a public
  one.
- >-
  Three near-identical product shapes (product, merchant_product, detailed_product) exist for
  three query scopes. `product` and `merchant_product` have identical field lists in v4.0, so the
  schema duplication buys nothing.
- >-
  Naming is inconsistent across the model: `flyer_*` internally versus `publication` externally,
  snake_case everywhere except `inventory_sub_item`/`cart_button` which are camelCase passthrough
  from the MI9 Retail API, and `category` (string) surviving on `sub_item` after v4.0 renamed it
  to `categories` (array) on the product models.
- >-
  Geometry (left/top/width/height) is embedded in three publication child models, confirming the
  data is designed for a renderer drawing over a flyer image rather than for generic commerce
  consumption.
