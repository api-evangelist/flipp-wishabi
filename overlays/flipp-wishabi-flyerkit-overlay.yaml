    x-apievangelist-observed-at: '2026-08-12'
    x-apievangelist-drift: >-
      `code` is declared `type: string` but was observed as an unquoted JSON number on a live 422.
    x-apievangelist-rfc9457: false
    x-apievangelist-catalog: errors/flipp-wishabi-problem-types.yml
